replicaCount: 1

image:
  repository: localhost:5001/kubedeck-agent
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

cluster:
  id: homelab
  name: Homelab
  domain: cluster.local

agent:
  listenAddress: ":8080"
  metricsInterval: 10s
  refreshDebounce: 250ms
  sseHeartbeat: 15s
  sseHistory: 256
  eventLimit: 100

auth:
  existingSecret: ""
  tokenKey: token

infisical:
  enabled: false
  hostAPI: http://infisical-backend.platform-secrets.svc.cluster.local:8080/api
  credentialsSecretName: infisical-universal-auth
  credentialsSecretNamespace: platform-secrets
  projectSlug: home-lab
  envSlug: local
  secretsPath: /apps/development-tools/kubedeck-agent

dnsManagement:
  enabled: false
  namespace: kube-system
  configMapName: coredns-custom
  overrideKey: kubedeck.override
  createConfigMap: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

terminationGracePeriodSeconds: 20

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
  ingressPodSelector:
    matchLabels:
      app.kubernetes.io/name: kubedeck

nodeSelector: {}
tolerations: []
affinity: {}
