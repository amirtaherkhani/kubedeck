{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubedeck-agent.fullname" . }}
  labels:
    {{- include "kubedeck-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubedeck-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressPodSelector | nindent 12 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
