{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubedeck.fullname" . }}
  labels:
    {{- include "kubedeck.labels" . | nindent 4 }}
  {{- if or .Values.ingress.forceHttps .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.forceHttps }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "kubedeck.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
