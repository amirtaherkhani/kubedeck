{{- if .Values.pgadmin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-storage.pgadminName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.pgadminLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "platform-storage.pgadminLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/pgadmin-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/pgadmin-secret.yaml") . | sha256sum }}
      labels:
        {{- include "platform-storage.labels" . | nindent 8 }}
        {{- include "platform-storage.pgadminLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 5050
      containers:
        - name: pgadmin
          image: "{{ .Values.pgadmin.image.repository }}:{{ .Values.pgadmin.image.tag }}"
          imagePullPolicy: {{ .Values.pgadmin.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 5050
            runAsGroup: 5050
          ports:
            - name: http
              containerPort: {{ .Values.pgadmin.service.targetPort }}
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.pgadminName" . }}
                  key: PGADMIN_DEFAULT_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.pgadminName" . }}
                  key: PGADMIN_DEFAULT_PASSWORD
            - name: PGADMIN_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: PGADMIN_LISTEN_PORT
              value: {{ .Values.pgadmin.service.targetPort | quote }}
            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers.json
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.pgadmin.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: config
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: config
              mountPath: /pgadmin4/config_local.py
              subPath: config_local.py
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "platform-storage.pgadminName" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "platform-storage.pgadminName" . }}
{{- end }}
