{{- if and .Values.kafka.enabled .Values.schemaRegistry.enabled .Values.schemaRegistry.uiIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-storage.schemaRegistryUiName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.schemaRegistryUiLabels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "platform-storage.schemaRegistryUiName" . }}-basic-auth@kubernetescrd
spec:
  ingressClassName: {{ .Values.schemaRegistry.uiIngress.className }}
  {{- if .Values.schemaRegistry.uiIngress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.schemaRegistry.uiIngress.host }}
      secretName: {{ .Values.schemaRegistry.uiIngress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.schemaRegistry.uiIngress.host }}
      http:
        paths:
          - path: /apis
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-storage.schemaRegistryName" . }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-storage.schemaRegistryUiName" . }}
                port:
                  name: http
{{- end }}
