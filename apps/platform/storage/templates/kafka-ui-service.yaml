{{- if and .Values.kafka.enabled .Values.kafkaUi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-storage.kafkaUiName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.kafkaUiLabels" . | nindent 4 }}
spec:
  type: {{ .Values.kafkaUi.service.type }}
  ports:
    - name: http
      port: {{ .Values.kafkaUi.service.port }}
      targetPort: http
  selector:
    {{- include "platform-storage.kafkaUiLabels" . | nindent 4 }}
{{- end }}
