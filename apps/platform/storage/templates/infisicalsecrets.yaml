{{- $items := list
  (dict "name" "postgresql" "path" "/apps/platform-storage/postgresql" "secretName" "postgresql")
  (dict "name" "pgadmin" "path" "/apps/platform-storage/pgadmin" "secretName" "pgadmin")
  (dict "name" "redis" "path" "/apps/platform-storage/redis" "secretName" "redis")
  (dict "name" "redis-commander" "path" "/apps/platform-storage/redis-commander" "secretName" "redis-commander")
  (dict "name" "redis-commander-basic-auth" "path" "/apps/platform-storage/redis-commander" "secretName" "redis-commander-basic-auth" "templateKey" "REDIS_COMMANDER_USERS" "templateName" "users")
  (dict "name" "rabbitmq" "path" "/apps/platform-storage/rabbitmq" "secretName" "rabbitmq")
  (dict "name" "kafka-ui" "path" "/apps/platform-storage/kafka-ui" "secretName" "kafka-ui-basic-auth" "templateKey" "KAFKA_UI_USERS" "templateName" "users")
  (dict "name" "schema-registry" "path" "/apps/platform-storage/schema-registry" "secretName" "schema-registry-ui-basic-auth" "templateKey" "SCHEMA_REGISTRY_USERS" "templateName" "users")
  (dict "name" "mongodb" "path" "/apps/platform-storage/mongodb" "secretName" "mongodb")
  (dict "name" "mongoku" "path" "/apps/platform-storage/mongoku" "secretName" "mongoku")
  (dict "name" "mongoku-basic-auth" "path" "/apps/platform-storage/mongoku-basic-auth" "secretName" "mongoku-basic-auth" "templateKey" "MONGOKU_BASIC_AUTH_USERS" "templateName" "users")
  (dict "name" "nats" "path" "/apps/platform-storage/nats" "secretName" "nats")
  (dict "name" "nats-ui" "path" "/apps/platform-storage/nats-ui" "secretName" "nats-ui-contexts" "templateKey" "NATS_UI_LOCAL_JSON" "templateName" "local.json")
  (dict "name" "nats-ui-basic-auth" "path" "/apps/platform-storage/nats-ui" "secretName" "nats-ui-basic-auth" "templateKey" "NATS_UI_USERS" "templateName" "users")
  (dict "name" "nats-monitoring" "path" "/apps/platform-storage/nats-monitoring" "secretName" "nats-monitoring-basic-auth" "templateKey" "NATS_MONITORING_USERS" "templateName" "users")
  (dict "name" "minio" "path" "/apps/platform-storage/minio" "secretName" "minio")
  (dict "name" "jaeger" "path" "/apps/platform-storage/jaeger" "secretName" "jaeger-ui-basic-auth" "templateKey" "JAEGER_USERS" "templateName" "users")
  (dict "name" "mailpit" "path" "/apps/platform-storage/mailpit" "secretName" "mailpit-ui-basic-auth" "templateKey" "MAILPIT_USERS" "templateName" "users")
  (dict "name" "grpcui" "path" "/apps/platform-storage/grpcui" "secretName" "grpcui-basic-auth" "templateKey" "GRPCUI_USERS" "templateName" "users")
-}}
{{- range $item := $items }}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ printf "infisical-%s" ($item.name | trunc 50 | trimSuffix "-") }}
  labels:
    app.kubernetes.io/name: platform-storage
    app.kubernetes.io/part-of: home-lab
    home-lab/managed-by: infisical
spec:
  hostAPI: http://infisical-backend.platform-secrets.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 1m
    instantUpdates: false
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: platform-secrets
      secretsScope:
        projectSlug: home-lab
        envSlug: local
        secretsPath: {{ $item.path }}
  managedSecretReference:
    secretName: {{ $item.secretName }}
    secretNamespace: {{ $.Release.Namespace }}
    creationPolicy: Owner
    {{- with $item.templateKey }}
    template:
      includeAllSecrets: false
      data:
        {{ $item.templateName }}: {{ printf "{{ .%s }}" . | quote }}
    {{- end }}
{{- end }}
