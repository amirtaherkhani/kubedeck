{{- if .Values.nats.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "platform-storage.natsName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.natsLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "platform-storage.natsHeadlessName" . }}
  replicas: {{ .Values.nats.replicaCount }}
  podManagementPolicy: {{ .Values.nats.podManagementPolicy }}
  minReadySeconds: {{ .Values.nats.minReadySeconds }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "platform-storage.natsLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/nats-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/nats-secret.yaml") . | sha256sum }}
      labels:
        {{- include "platform-storage.labels" . | nindent 8 }}
        {{- include "platform-storage.natsLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.nats.terminationGracePeriodSeconds }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.nats.scheduling.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    {{- include "platform-storage.natsLabels" . | nindent 20 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.nats.scheduling.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.nats.scheduling.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "platform-storage.natsLabels" . | nindent 14 }}
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --config
            - /etc/nats/nats-server.conf
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_ADVERTISE
              value: "$(POD_NAME).{{ include "platform-storage.natsHeadlessName" . }}.$(POD_NAMESPACE).svc.cluster.local:{{ .Values.nats.cluster.routePort }}"
            - name: GOMEMLIMIT
              value: {{ .Values.nats.goMemLimit | quote }}
            - name: NATS_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.natsName" . }}
                  key: NATS_ADMIN_USERNAME
            - name: NATS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.natsName" . }}
                  key: NATS_ADMIN_PASSWORD
            - name: NATS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.natsName" . }}
                  key: NATS_USERNAME
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.natsName" . }}
                  key: NATS_PASSWORD
            - name: NATS_FINANCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.natsName" . }}
                  key: NATS_FINANCE_USERNAME
            - name: NATS_FINANCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.natsName" . }}
                  key: NATS_FINANCE_PASSWORD
            - name: NATS_CLUSTER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.natsName" . }}
                  key: NATS_CLUSTER_USERNAME
            - name: NATS_CLUSTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.natsName" . }}
                  key: NATS_CLUSTER_PASSWORD
            {{- $name := include "platform-storage.natsName" . }}
            {{- $headless := include "platform-storage.natsHeadlessName" . }}
            {{- $namespace := .Release.Namespace }}
            {{- $routePort := .Values.nats.cluster.routePort }}
            {{- range $index := until (int .Values.nats.replicaCount) }}
            - name: NATS_ROUTE_{{ $index }}
              value: "nats://$(NATS_CLUSTER_USERNAME):$(NATS_CLUSTER_PASSWORD)@{{ $name }}-{{ $index }}.{{ $headless }}.{{ $namespace }}.svc.cluster.local:{{ $routePort }}"
            {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.nats.service.clientPort }}
            - name: cluster
              containerPort: {{ .Values.nats.cluster.routePort }}
            - name: monitoring
              containerPort: {{ .Values.nats.service.monitoringPort }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - >-
                    nats-server --signal ldm=/var/run/nats/nats-server.pid;
                    sleep {{ .Values.nats.preStopSleepSeconds }}
          startupProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitoring
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitoring
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /var/run/nats
            - name: tmp
              mountPath: /tmp
        {{- if .Values.nats.prometheusExporter.enabled }}
        - name: prometheus-exporter
          image: "{{ .Values.nats.prometheusExporter.image.repository }}:{{ .Values.nats.prometheusExporter.image.tag }}"
          imagePullPolicy: {{ .Values.nats.prometheusExporter.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - -varz
            - -connz
            - -routez
            - -subz
            - -healthz
            - -jsz=all
            - -use_internal_server_id
            - -use_internal_server_name
            - -prefix=nats
            - http://127.0.0.1:{{ .Values.nats.service.monitoringPort }}
          ports:
            - name: metrics
              containerPort: {{ .Values.nats.prometheusExporter.port }}
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.nats.prometheusExporter.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "platform-storage.natsName" . }}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.nats.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.nats.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.nats.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size | quote }}
  {{- end }}
{{- end }}
