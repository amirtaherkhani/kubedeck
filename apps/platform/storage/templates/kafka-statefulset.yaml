{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "platform-storage.kafkaName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.kafkaLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "platform-storage.kafkaName" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform-storage.kafkaLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform-storage.labels" . | nindent 8 }}
        {{- include "platform-storage.kafkaLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports:
            - name: internal
              containerPort: {{ .Values.kafka.service.internalPort }}
            - name: controller
              containerPort: {{ .Values.kafka.service.controllerPort }}
            - name: external
              containerPort: {{ .Values.kafka.service.externalPort }}
          env:
            - name: CLUSTER_ID
              value: {{ .Values.kafka.kraft.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@{{ include "platform-storage.kafkaName" . }}-0.{{ include "platform-storage.kafkaName" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.kafka.service.controllerPort }}"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:{{ .Values.kafka.service.internalPort }},CONTROLLER://0.0.0.0:{{ .Values.kafka.service.controllerPort }},EXTERNAL://0.0.0.0:{{ .Values.kafka.service.externalPort }}"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://{{ include "platform-storage.kafkaName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.kafka.service.internalPort }},EXTERNAL://{{ include "platform-storage.kafkaName" . }}.local.dev:{{ .Values.kafka.service.externalPort }}"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.kafka.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size | quote }}
{{- end }}
