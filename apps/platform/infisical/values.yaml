backend:
  enabled: true
  replicaCount: 1
  image:
    repository: infisical/infisical
    tag: v0.151.0
    pullPolicy: IfNotPresent
  kubeSecretRef: infisical-secrets
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 350m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
    tag: 7.2.5-debian-12-r6
  auth:
    enabled: false

mongodb:
  enabled: false

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: platform-secrets-infisical-https-redirect@kubernetescrd
  hostName: infisical.local.dev
  tls:
    - secretName: local-dev-tls
      hosts:
        - infisical.local.dev
  nginx:
    enabled: false

mailhog:
  enabled: false
