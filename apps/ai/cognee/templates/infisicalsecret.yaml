apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: cognee
  labels:
    {{- include "cognee.labels" . | nindent 4 }}
    home-lab/managed-by: infisical
spec:
  hostAPI: http://infisical-backend.platform-secrets.svc.cluster.local:8080/api
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: platform-secrets
      secretsScope:
        projectSlug: home-lab
        envSlug: local
        secretsPath: /apps/ai-tools/cognee
  managedSecretReference:
    secretName: {{ .Values.secret.name }}
    secretNamespace: {{ .Release.Namespace }}
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        LLM_API_KEY: {{ printf "{{ .COGNEE_LLM_API_KEY.Value }}" | quote }}
        FASTAPI_USERS_JWT_SECRET: {{ printf "{{ .COGNEE_FASTAPI_USERS_JWT_SECRET.Value }}" | quote }}
        ENV: {{ printf "{{ .COGNEE_ENV.Value }}" | quote }}
        PYTHONPATH: {{ printf "{{ .COGNEE_PYTHONPATH.Value }}" | quote }}
        DB_PROVIDER: {{ printf "{{ .COGNEE_DB_PROVIDER.Value }}" | quote }}
        VECTOR_DB_PROVIDER: {{ printf "{{ .COGNEE_VECTOR_DB_PROVIDER.Value }}" | quote }}
        GRAPH_DATABASE_PROVIDER: {{ printf "{{ .COGNEE_GRAPH_DATABASE_PROVIDER.Value }}" | quote }}
        DATA_ROOT_DIRECTORY: {{ printf "{{ .COGNEE_DATA_ROOT_DIRECTORY.Value }}" | quote }}
        SYSTEM_ROOT_DIRECTORY: {{ printf "{{ .COGNEE_SYSTEM_ROOT_DIRECTORY.Value }}" | quote }}
        LLM_PROVIDER: {{ printf "{{ .COGNEE_LLM_PROVIDER.Value }}" | quote }}
        LLM_MODEL: {{ printf "{{ .COGNEE_LLM_MODEL.Value }}" | quote }}
        REQUIRE_AUTHENTICATION: {{ printf "{{ .COGNEE_REQUIRE_AUTHENTICATION.Value }}" | quote }}
        ENABLE_BACKEND_ACCESS_CONTROL: {{ printf "{{ .COGNEE_ENABLE_BACKEND_ACCESS_CONTROL.Value }}" | quote }}
        TELEMETRY_DISABLED: {{ printf "{{ .COGNEE_TELEMETRY_DISABLED.Value }}" | quote }}
        LOG_LEVEL: {{ printf "{{ .COGNEE_LOG_LEVEL.Value }}" | quote }}
