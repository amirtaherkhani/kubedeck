replicas: 1

admin:
  existingSecret: grafana-admin
  userKey: GRAFANA_ADMIN_USER
  passwordKey: GRAFANA_ADMIN_PASSWORD

# The local-path PVC is ReadWriteOnce, so replacement pods must not overlap.
deploymentStrategy:
  type: Recreate

revisionHistoryLimit: 3
enableServiceLinks: false

testFramework:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
  labels:
    release: monitoring

ingress:
  enabled: true
  ingressClassName: traefik
  path: /
  pathType: Prefix
  hosts:
    - grafana.local.dev
  tls:
    - secretName: local-dev-tls
      hosts:
        - grafana.local.dev

persistence:
  enabled: true
  type: pvc
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  finalizers:
    - kubernetes.io/pvc-protection

initChownData:
  enabled: true
  # Reuse the pinned Grafana image, which is already present on Rancher Desktop.
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.1.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

grafana.ini:
  paths:
    data: /var/lib/grafana/
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  log:
    mode: console
  server:
    domain: grafana.local.dev
    root_url: https://grafana.local.dev
  security:
    cookie_secure: true
    cookie_samesite: lax
    allow_embedding: false
    disable_gravatar: true
  users:
    default_theme: dark
    viewers_can_edit: false
  auth.anonymous:
    enabled: true
    org_role: Admin
  unified_alerting:
    enabled: true
  plugins:
    # Bundled plugins are sufficient for this stack; avoid offline update noise.
    preinstall_disabled: true
    preinstall_auto_update: false
  live:
    max_connections: 100

datasources:
  datasources.yaml:
    apiVersion: 1
    prune: true
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
      - name: Alertmanager
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          prometheusType: Prometheus
          prometheusVersion: 3.13.1
          timeInterval: 30s
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: traceID

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        editable: false
        jsonData:
          derivedFields:
            - name: traceId
              matcherRegex: '(?:trace_id|traceId|traceID)[=:\" ]+([0-9a-fA-F]{16,32})'
              datasourceUid: tempo
              url: '$${__value.raw}'

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: prometheus
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: true
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags:
              - key: service.name
                value: service_name
              - key: k8s.namespace.name
                value: namespace
              - key: k8s.pod.name
                value: pod

      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://monitoring-kube-prometheus-alertmanager.observability.svc.cluster.local:9093
        editable: false
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false

sidecar:
  image:
    registry: docker.io
    repository: kiwigrid/k8s-sidecar
    tag: "2.8.1"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      # Avoid CFS throttling while dashboard discovery scans all namespaces.
      memory: 256Mi
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    resource: configmap
    folderAnnotation: grafana_folder
    provider:
      name: sidecarProvider
      orgid: 1
      type: file
      disableDelete: false
      allowUiUpdates: false
      foldersFromFilesStructure: true
