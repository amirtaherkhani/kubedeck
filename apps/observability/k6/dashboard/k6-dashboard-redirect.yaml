apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: k6-dashboard-redirect
  namespace: observability
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/component: grafana-dashboard
spec:
  redirectRegex:
    regex: '^https?://k6-dashboard\.local\.dev(?:/.*)?$'
    replacement: 'https://grafana.local.dev/d/k6-prometheus/k6-prometheus'
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k6-dashboard
  namespace: observability
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/component: grafana-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: observability-k6-dashboard-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - k6-dashboard.local.dev
      secretName: local-dev-tls
  rules:
    - host: k6-dashboard.local.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: service
