apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: k6-dashboard-redirect
spec:
  redirectRegex:
    regex: "^https?://k6-dashboard\\.dev\\.local/.*"
    replacement: "https://grafana.local.dev/d/k6-prometheus/k6-prometheus?from=now-10d&to=now"
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k6-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: observability-k6-dashboard-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - k6-dashboard.local.dev
      secretName: local-dev-tls
  rules:
    - host: k6-dashboard.local.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: service
