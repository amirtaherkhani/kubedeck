project:
  slug: home-lab
  displayName: home-lab
  environment: local
  secretsPath: /apps/development-tools/paperclip

machineIdentity:
  name: home-lab-kubernetes
  type: universal-auth
  role: viewer
  purpose: Home-lab Kubernetes workload secret synchronization
  credentialsSecret:
    name: infisical-universal-auth
    namespace: platform-secrets
    keys:
      - clientId
      - clientSecret

managedSecret:
  name: paperclip-runtime
  namespace: development-tools
  sourceKeys:
    - PAPERCLIP_DATABASE_URL
    - PAPERCLIP_BETTER_AUTH_SECRET
    - PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
    - PAPERCLIP_SECRETS_MASTER_KEY
    - PAPERCLIP_PUBLIC_URL
    - PAPERCLIP_DEPLOYMENT_MODE
    - PAPERCLIP_DEPLOYMENT_EXPOSURE
    - PAPERCLIP_AUTH_DISABLE_SIGN_UP
    - PAPERCLIP_SECRETS_PROVIDER
    - PAPERCLIP_TELEMETRY_DISABLED
    - OPENAI_API_KEY

bootstrap:
  supported: true
  identity:
    username: admin
    firstName: admin
    lastName: admin
    email: admin@local.dev
  secretKeys:
    - PAPERCLIP_ADMIN_EMAIL
    - PAPERCLIP_ADMIN_PASSWORD
  delivery: Use the supported one-shot bootstrap flow with the Paperclip PVC; remove the task after success and never print the password.

database:
  engine: postgresql
  service: postgresql.platform-storage.svc.cluster.local
  port: 5432
  connectionStringKey: PAPERCLIP_DATABASE_URL
  note: Use the existing platform-storage PostgreSQL instance; do not provision a Paperclip database StatefulSet.

rotation:
  machineIdentity: Rotate clientSecret according to the Infisical access policy.
  applicationSecrets: Rotate BETTER_AUTH_SECRET, PAPERCLIP_TOOL_ACTION_SIGNING_SECRET, PAPERCLIP_SECRETS_MASTER_KEY, and OPENAI_API_KEY through the home-lab Infisical project before restarting Paperclip.
