{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "Paperclip uses a single writer for its local instance state; replicaCount must remain 1." }}
{{- end }}
{{- if not .Values.image.tag }}
{{- fail "image.tag is required and must be an immutable deployment tag." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperclip.fullname" . }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paperclip.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paperclip.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "paperclip.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: paperclip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: HOST
              value: 0.0.0.0
            - name: SERVE_UI
              value: "true"
            - name: PAPERCLIP_HOME
              value: /paperclip
            - name: PAPERCLIP_INSTANCE_ID
              value: default
            - name: PAPERCLIP_CONFIG
              value: /paperclip/instances/default/config.json
            - name: CODEX_HOME
              value: /var/run/paperclip-codex
            - name: PAPERCLIP_SECRETS_MASTER_KEY_FILE
              value: /paperclip/secrets/master.key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: BETTER_AUTH_SECRET
            - name: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
            - name: PAPERCLIP_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: PAPERCLIP_PUBLIC_URL
            - name: BETTER_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: BETTER_AUTH_URL
            - name: PAPERCLIP_DEPLOYMENT_MODE
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: PAPERCLIP_DEPLOYMENT_MODE
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: PAPERCLIP_DEPLOYMENT_EXPOSURE
            - name: PAPERCLIP_SECRETS_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: PAPERCLIP_SECRETS_PROVIDER
            - name: PAPERCLIP_TELEMETRY_DISABLED
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: PAPERCLIP_TELEMETRY_DISABLED
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.fullname" . }}-runtime
                  key: PAPERCLIP_AUTH_DISABLE_SIGN_UP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ (index .Values.ingress.hosts 0).host | quote }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ (index .Values.ingress.hosts 0).host | quote }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ (index .Values.ingress.hosts 0).host | quote }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /paperclip
            - name: secrets
              mountPath: /paperclip/secrets
              readOnly: true
            - name: codex-auth
              mountPath: /var/run/paperclip-codex
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "paperclip.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: secrets
          secret:
            secretName: {{ include "paperclip.fullname" . }}-runtime
            items:
              - key: PAPERCLIP_SECRETS_MASTER_KEY
                path: master.key
        - name: codex-auth
          secret:
            secretName: {{ include "paperclip.fullname" . }}-runtime
            defaultMode: 0400
            items:
              - key: CODEX_AUTH_JSON
                path: auth.json
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
