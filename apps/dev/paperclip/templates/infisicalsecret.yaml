{{- if ne .Values.infisical.envSlug "local" }}
{{- fail "Paperclip is single-environment; infisical.envSlug must remain local." }}
{{- end }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "paperclip.fullname" . }}-runtime
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
    home-lab/managed-by: infisical
spec:
  hostAPI: http://infisical-backend.platform-secrets.svc.cluster.local:8080/api
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ required "infisical.credentialsSecretName is required" .Values.infisical.credentialsSecretName }}
        secretNamespace: {{ required "infisical.credentialsSecretNamespace is required" .Values.infisical.credentialsSecretNamespace }}
      secretsScope:
        projectSlug: {{ required "infisical.projectSlug is required" .Values.infisical.projectSlug }}
        envSlug: {{ required "infisical.envSlug is required" .Values.infisical.envSlug }}
        secretsPath: {{ required "infisical.secretsPath is required" .Values.infisical.secretsPath }}
  managedSecretReference:
    secretName: {{ include "paperclip.fullname" . }}-runtime
    secretNamespace: {{ .Release.Namespace }}
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        DATABASE_URL: '{{ "{{ .PAPERCLIP_DATABASE_URL.Value }}" }}'
        BETTER_AUTH_SECRET: '{{ "{{ .PAPERCLIP_BETTER_AUTH_SECRET.Value }}" }}'
        PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: '{{ "{{ .PAPERCLIP_TOOL_ACTION_SIGNING_SECRET.Value }}" }}'
        PAPERCLIP_SECRETS_MASTER_KEY: '{{ "{{ .PAPERCLIP_SECRETS_MASTER_KEY.Value }}" }}'
        PAPERCLIP_PUBLIC_URL: '{{ "{{ .PAPERCLIP_PUBLIC_URL.Value }}" }}'
        BETTER_AUTH_URL: '{{ "{{ .PAPERCLIP_PUBLIC_URL.Value }}" }}'
        PAPERCLIP_DEPLOYMENT_MODE: '{{ "{{ .PAPERCLIP_DEPLOYMENT_MODE.Value }}" }}'
        PAPERCLIP_DEPLOYMENT_EXPOSURE: '{{ "{{ .PAPERCLIP_DEPLOYMENT_EXPOSURE.Value }}" }}'
        PAPERCLIP_AUTH_DISABLE_SIGN_UP: '{{ "{{ .PAPERCLIP_AUTH_DISABLE_SIGN_UP.Value }}" }}'
        PAPERCLIP_SECRETS_PROVIDER: '{{ "{{ .PAPERCLIP_SECRETS_PROVIDER.Value }}" }}'
        PAPERCLIP_TELEMETRY_DISABLED: '{{ "{{ .PAPERCLIP_TELEMETRY_DISABLED.Value }}" }}'
        OPENAI_API_KEY: '{{ "{{ .OPENAI_API_KEY.Value }}" }}'
