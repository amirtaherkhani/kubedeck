server:
  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

  config:
    logLevel: "info"
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: postgresql.platform-storage.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgresql
            secretKey: TEMPORAL_PASSWORD
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: postgresql.platform-storage.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgresql
            secretKey: TEMPORAL_PASSWORD
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 3d

  frontend:
    service:
      type: LoadBalancer

web:
  enabled: true
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: development-tools-temporal-https-redirect@kubernetescrd
    hosts:
      - temporal.local.dev/
    tls:
      - secretName: local-dev-tls
        hosts:
          - temporal.local.dev
