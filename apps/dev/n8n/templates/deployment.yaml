apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.fullname" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "n8n.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "n8n.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: n8n
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: DB_TYPE
              value: {{ .Values.database.type | quote }}
            - name: DB_POSTGRESDB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_POSTGRESDB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_POSTGRESDB_DATABASE
              value: {{ .Values.database.database | quote }}
            - name: DB_POSTGRESDB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_POSTGRESDB_SCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.passwordKey | quote }}
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.encryptionKeySecretName | quote }}
                  key: {{ .Values.config.encryptionKeySecretKey | quote }}
            - name: N8N_HOST
              value: {{ .Values.config.host | quote }}
            - name: N8N_PORT
              value: {{ .Values.config.port | quote }}
            - name: N8N_PROTOCOL
              value: {{ .Values.config.protocol | quote }}
            - name: N8N_EDITOR_BASE_URL
              value: {{ .Values.config.editorBaseUrl | quote }}
            - name: N8N_WEBHOOK_URL
              value: {{ .Values.config.webhookUrl | quote }}
            - name: N8N_PROXY_HOPS
              value: {{ .Values.config.proxyHops | quote }}
            - name: N8N_SECURE_COOKIE
              value: {{ .Values.config.secureCookie | quote }}
            - name: GENERIC_TIMEZONE
              value: {{ .Values.config.genericTimezone | quote }}
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            - name: N8N_METRICS
              value: {{ .Values.config.metrics | quote }}
            - name: QUEUE_HEALTH_CHECK_ACTIVE
              value: {{ .Values.config.queueHealthCheckActive | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "n8n.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
