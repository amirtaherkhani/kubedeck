# Plane Community Edition 1.4.1 from the pinned makeplane/plane-ce chart 1.6.2.
# Credentials are injected by InfisicalSecret resources.
planeVersion: v1.4.1

ingress:
  enabled: true
  appHost: plane.local.dev
  minioHost: ""
  rabbitmqHost: ""
  ingressClass: traefik
  traefik:
    maxRequestBodyBytes: 20971520

ssl:
  tls_secret_name: local-dev-tls
  createIssuer: false
  generateCerts: false

redis:
  local_setup: true
  image: valkey/valkey:7.2.11-alpine
  storageClass: local-path
  volumeSize: 100Mi

postgres:
  local_setup: true
  image: postgres:15.7-alpine
  storageClass: local-path
  volumeSize: 1Gi

rabbitmq:
  local_setup: true
  image: rabbitmq:3.13.6-management-alpine
  storageClass: local-path

minio:
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  image_mc: minio/mc:RELEASE.2025-08-13T08-35-41Z
  local_setup: true
  storageClass: local-path
  volumeSize: 1Gi
  env:
    minio_endpoint_ssl: false

external_secrets:
  rabbitmq_existingSecret: plane-rabbitmq
  pgdb_existingSecret: plane-postgres
  doc_store_existingSecret: plane-storage
  app_env_existingSecret: plane-app
  live_env_existingSecret: plane-live

env:
  pgdb_username: ""
  pgdb_password: ""
  pgdb_name: ""
  remote_redis_url: ""
  pgdb_remote_url: ""
  docstore_bucket: uploads
  doc_upload_size_limit: "5242880"
  aws_access_key: ""
  aws_secret_access_key: ""
  aws_region: ""
  aws_s3_endpoint_url: ""
  secret_key: ""
  live_server_secret_key: ""
  cors_allowed_origins: https://plane.local.dev
  default_cluster_domain: cluster.local
  api_key_rate_limit: 60/minute
