{{- if and .Values.rbac.create .Values.dnsManagement.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kuchdesk-agent.fullname" . }}-coredns
  namespace: {{ required "dnsManagement.namespace is required" .Values.dnsManagement.namespace }}
  labels:
    {{- include "kuchdesk-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kuchdesk-agent.fullname" . }}-coredns
subjects:
  - kind: ServiceAccount
    name: {{ include "kuchdesk-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
