{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kuchdesk-agent.fullname" . }}{{ if .Values.rbac.clusterAdmin }}-admin{{ end }}
  labels:
    {{- include "kuchdesk-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ ternary "cluster-admin" (include "kuchdesk-agent.fullname" .) .Values.rbac.clusterAdmin }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kuchdesk-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
