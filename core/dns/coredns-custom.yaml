apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  labels:
    app.kubernetes.io/name: coredns
    app.kubernetes.io/component: local-dns
    app.kubernetes.io/part-of: home-lab
data:
  local-dev.server: |
    local.dev:53 {
      errors
      cache 30
      template IN A local.dev {
        match ^(([^.]+)\.)+local\.dev\.$
        answer "{{ .Name }} 30 IN A 192.168.64.14"
      }
      forward . /etc/resolv.conf
    }
  kubedeck.override: |
    # KubeDeck Agent may extend this block with managed service aliases.
