apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-inotify-capacity
  namespace: platform-system
  labels:
    app.kubernetes.io/name: node-inotify-capacity
    app.kubernetes.io/component: node-configuration
    app.kubernetes.io/part-of: home-lab
    app.kubernetes.io/managed-by: home-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-inotify-capacity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-inotify-capacity
        app.kubernetes.io/component: node-configuration
        app.kubernetes.io/part-of: home-lab
        app.kubernetes.io/managed-by: home-lab
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      initContainers:
        - name: configure-inotify-capacity
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              setting=/host-proc-sys/fs/inotify/max_user_instances
              current="$(cat "${setting}")"
              target=1024
              if [ "${current}" -lt "${target}" ]; then
                echo "${target}" > "${setting}"
              fi
              test "$(cat "${setting}")" -ge "${target}"
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
            readOnlyRootFilesystem: true
            runAsNonRoot: false
          volumeMounts:
            - name: host-proc-sys
              mountPath: /host-proc-sys
      containers:
        - name: keepalive
          image: busybox:1.37.0
          command:
            - sleep
            - "2147483647"
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
            limits:
              cpu: 10m
              memory: 8Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
      terminationGracePeriodSeconds: 5
      volumes:
        - name: host-proc-sys
          hostPath:
            path: /proc/sys
            type: Directory
