# Official Cognee image pinned to the published manifest-list digest.
replicaCount: 1

image:
  repository: cognee/cognee
  tag: "1.4.1"
  digest: "sha256:ddef4fbd9f17d1487bfc0f097a295632da2d052510b05a723c943b5b2b776970"
  pullPolicy: IfNotPresent

service:
  port: 8000

ingress:
  enabled: true
  className: traefik
  host: cognee.local.dev
  tlsSecretName: local-dev-tls
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

persistence:
  enabled: true
  storageClass: local-path
  size: 5Gi
  mountPath: /data

secret:
  name: cognee

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

probes:
  path: /health
  startupFailureThreshold: 60
  periodSeconds: 5

serviceMonitor:
  enabled: false
