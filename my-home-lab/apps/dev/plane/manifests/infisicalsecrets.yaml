apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: plane-rabbitmq
  namespace: development-tools
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: home-lab
    home-lab/managed-by: infisical
spec:
  hostAPI: http://infisical-backend.platform-secrets.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 1m
    instantUpdates: false
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: platform-secrets
      secretsScope:
        projectSlug: home-lab
        envSlug: local
        secretsPath: /apps/development-tools/plane/rabbitmq
  managedSecretReference:
    secretName: plane-rabbitmq
    secretNamespace: development-tools
    creationPolicy: Owner
    template:
      includeAllSecrets: true
      data:
        RABBITMQ_DEFAULT_USER: '{{ .PLANE_RABBITMQ_DEFAULT_USER.Value }}'
        RABBITMQ_DEFAULT_PASS: '{{ .PLANE_RABBITMQ_DEFAULT_PASS.Value }}'
---
