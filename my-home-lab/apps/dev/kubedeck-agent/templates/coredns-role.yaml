{{- if and .Values.rbac.create .Values.dnsManagement.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubedeck-agent.fullname" . }}-coredns
  namespace: {{ required "dnsManagement.namespace is required" .Values.dnsManagement.namespace }}
  labels:
    {{- include "kubedeck-agent.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - {{ required "dnsManagement.configMapName is required" .Values.dnsManagement.configMapName }}
    verbs:
      - get
      - update
{{- end }}
