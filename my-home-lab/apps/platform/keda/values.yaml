# KEDA is the shared event-driven scaler. Individual application ScaledObjects
# remain application-owned and must use their own namespace-local credentials.
clusterName: my-home-lab-rancher-desktop
clusterDomain: cluster.local

image:
  keda:
    tag: "2.20.2"
  metricsApiServer:
    tag: "2.20.2"
  webhooks:
    tag: "2.20.2"
  pullPolicy: IfNotPresent

crds:
  install: true

logging:
  operator:
    level: info
    format: json
  metricServer:
    zapLevel: info
    zapEncoder: json
  webhooks:
    level: info
    format: json

resources:
  operator:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metricServer:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  webhooks:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

podDisruptionBudget:
  operator:
    minAvailable: 1
  metricServer:
    minAvailable: 1
  webhooks:
    minAvailable: 1

prometheus:
  operator:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  webhooks:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
