{{- if and .Values.rabbitmq.enabled .Values.rabbitmq.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-storage.rabbitmqName" . }}-grafana-dashboard
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.rabbitmqLabels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ .Values.rabbitmq.grafanaDashboard.folder | quote }}
data:
  rabbitmq-overview.json: |-
{{ .Files.Get "dashboards/rabbitmq-overview.json" | indent 4 }}
{{- end }}
