{{- if and .Values.pgadmin.enabled .Values.pgadmin.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-storage.pgadminName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.pgadminLabels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.pgadmin.ingress.className }}
  {{- if .Values.pgadmin.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.pgadmin.ingress.host }}
      secretName: {{ .Values.pgadmin.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.pgadmin.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-storage.pgadminName" . }}
                port:
                  number: {{ .Values.pgadmin.service.port }}
{{- end }}
