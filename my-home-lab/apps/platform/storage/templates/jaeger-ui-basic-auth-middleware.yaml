{{- if and .Values.jaeger.enabled .Values.jaeger.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "platform-storage.jaegerUiName" . }}-basic-auth
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.jaegerUiLabels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ include "platform-storage.jaegerUiName" . }}-basic-auth
{{- end }}
