{{- if and .Values.kafka.enabled .Values.schemaRegistry.enabled .Values.schemaRegistry.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-storage.schemaRegistryName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.schemaRegistryLabels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.schemaRegistry.ingress.className }}
  {{- if .Values.schemaRegistry.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.schemaRegistry.ingress.host }}
      secretName: {{ .Values.schemaRegistry.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.schemaRegistry.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-storage.schemaRegistryName" . }}
                port:
                  name: http
{{- end }}
