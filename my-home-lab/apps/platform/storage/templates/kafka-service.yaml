{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-storage.kafkaName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.kafkaLabels" . | nindent 4 }}
spec:
  type: {{ .Values.kafka.service.type }}
  ports:
    - name: internal
      port: {{ .Values.kafka.service.internalPort }}
      targetPort: internal
    - name: external
      port: {{ .Values.kafka.service.externalPort }}
      targetPort: external
  selector:
    {{- include "platform-storage.kafkaLabels" . | nindent 4 }}
{{- end }}
