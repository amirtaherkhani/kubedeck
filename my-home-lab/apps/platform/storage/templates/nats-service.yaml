{{- if .Values.nats.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-storage.natsName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.natsLabels" . | nindent 4 }}
spec:
  type: {{ .Values.nats.service.type }}
  ports:
    - name: client
      port: {{ .Values.nats.service.clientPort }}
      targetPort: client
  selector:
    {{- include "platform-storage.natsLabels" . | nindent 4 }}
{{- end }}
