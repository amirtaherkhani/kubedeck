{{- if and .Values.pgadmin.enabled .Values.pgadmin.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform-storage.pgadminName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.pgadminLabels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.pgadmin.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.pgadmin.persistence.size | quote }}
{{- end }}
