{{- if and .Values.nats.enabled .Values.nats.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-storage.natsName" . }}-grafana-dashboard
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.natsMetricsLabels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ .Values.nats.grafanaDashboard.folder | quote }}
data:
  nats-cluster-overview.json: |-
{{ .Files.Get "dashboards/nats-cluster-overview.json" | indent 4 }}
{{- end }}
