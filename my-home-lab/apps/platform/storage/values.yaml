nats:
  enabled: true
  name: nats
  replicaCount: 3
  auth:
    adminUsername: ""
    adminPassword: ""
    username: ""
    password: ""
    financeUsername: ""
    financePassword: ""
    financeTestUsername: ""
    financeTestPassword: ""
    clusterUsername: ""
    clusterPassword: ""
  image:
    repository: nats
    tag: "2.11.17-alpine3.22"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    clientPort: 4222
    monitoringPort: 8222
  cluster:
    enabled: true
    name: platform-nats
    routePort: 6222
    connectRetries: 120
    poolSize: 3
    noAdvertise: true
  monitoringIngress:
    enabled: true
    className: traefik
    host: nats-monitor.local.dev
    tls:
      enabled: true
      secretName: local-dev-tls
  prometheusExporter:
    enabled: true
    image:
      repository: natsio/prometheus-nats-exporter
      tag: "0.20.1"
      pullPolicy: IfNotPresent
    port: 7777
    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s
      additionalLabels:
        release: monitoring
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  grafanaDashboard:
    enabled: true
    folder: NATS
  jetstream:
    enabled: true
    storeDir: /data/jetstream
    maxMemoryStore: 128MB
    maxFileStore: 3GB
    requestQueueLimit: 10000
  persistence:
    enabled: true
    storageClass: local-path
    size: 4Gi
  podManagementPolicy: Parallel
  minReadySeconds: 10
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 35
  lameDuckDuration: 30s
  lameDuckGracePeriod: 10s
  goMemLimit: 460MiB
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  scheduling:
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
