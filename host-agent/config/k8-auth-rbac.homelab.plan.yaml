# REVIEW-ONLY activation plan. No resources from this file have been applied.
# This changes authentication RBAC only; it does not grant workload/Secret access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedesk-infisical-reader
  namespace: development-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedesk-infisical-token-reviewer
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedesk-infisical-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubedesk-infisical-token-reviewer
subjects:
  - kind: ServiceAccount
    name: kubedesk-infisical-reader
    namespace: development-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubedesk-infisical-token-request
  namespace: development-tools
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [kubedesk-infisical-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubedesk-infisical-token-request
  namespace: development-tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubedesk-infisical-token-request
subjects:
  - kind: ServiceAccount
    name: infisical-opera-controller-manager
    namespace: platform-secrets
