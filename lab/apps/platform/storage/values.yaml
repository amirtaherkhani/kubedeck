## Inline credentials are intentionally disabled. All application and UI
## credentials are synchronized from Infisical into namespace-local Secrets.
inlineSecrets: false

infisical:
  projectSlug: home-lab
  envSlug: local

postgresql:
  enabled: true
  name: postgresql
  image:
    repository: registry-1.docker.io/bitnami/postgresql
    tag: "latest@sha256:e6463683ee29a3bbe00051cb28f5d7871f4dde9f07008ebe3c65c230d85d2eb9"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 5432
  persistence:
    enabled: true
    storageClass: local-path
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "4"
      memory: 1Gi
redis:
  enabled: true
  name: redis
  image:
    repository: ecr-public.aws.com/docker/library/redis
    tag: 8.2.3-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    storageClass: local-path
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
rabbitmq:
  enabled: true
  name: rabbitmq
  image:
    repository: ecr-public.aws.com/docker/library/rabbitmq
    tag: 3-management
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    amqpPort: 5672
    managementPort: 15672
    metricsPort: 15692
  metrics:
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      additionalLabels:
        release: monitoring
    detailed:
      # Four Finance queues make this bounded per-object scrape safe. Keep the
      # platform-wide /metrics scrape aggregated to avoid unbounded cardinality.
      enabled: true
      vhost: /vero-vault-finance
      families:
        - queue_coarse_metrics
        - queue_metrics
        - vhost_status
        - exchange_names
        - exchange_bindings
  grafanaDashboard:
    enabled: true
    folder: RabbitMQ
  ingress:
    enabled: true
    className: traefik
    host: rabbitmq-ui.local.dev
    tls:
      enabled: true
      secretName: local-dev-tls
  persistence:
    enabled: true
    storageClass: local-path
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # The 500m ceiling sustained 27-32% CFS throttling during idle checks.
      cpu: "1"
      memory: 768Mi
nats:
  enabled: true
  name: nats
  replicaCount: 3
  auth:
    adminUsername: ""
    adminPassword: ""
    username: ""
    password: ""
    financeUsername: ""
    financePassword: ""
    financeTestUsername: ""
    financeTestPassword: ""
    clusterUsername: ""
    clusterPassword: ""
  image:
    repository: nats
    tag: "2.11.17-alpine3.22"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    clientPort: 4222
    monitoringPort: 8222
  cluster:
    enabled: true
    name: platform-nats
    routePort: 6222
    connectRetries: 120
    poolSize: 3
    noAdvertise: true
  monitoringIngress:
    enabled: true
    className: traefik
    host: nats-monitor.local.dev
    tls:
      enabled: true
      secretName: local-dev-tls
  prometheusExporter:
    enabled: true
    image:
      repository: natsio/prometheus-nats-exporter
      tag: "0.20.1"
      pullPolicy: IfNotPresent
    port: 7777
    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s
      additionalLabels:
        release: monitoring
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  grafanaDashboard:
    enabled: true
    folder: NATS
  jetstream:
    enabled: true
    storeDir: /data/jetstream
    maxMemoryStore: 128MB
    maxFileStore: 3GB
    requestQueueLimit: 10000
  persistence:
    enabled: true
    storageClass: local-path
    size: 4Gi
  podManagementPolicy: Parallel
  minReadySeconds: 10
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 35
  lameDuckDuration: 30s
  lameDuckGracePeriod: 10s
  goMemLimit: 460MiB
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  scheduling:
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
