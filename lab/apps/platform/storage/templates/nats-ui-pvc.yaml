{{- if and .Values.nats.enabled .Values.natsUi.enabled .Values.natsUi.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform-storage.natsUiName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.natsUiLabels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.natsUi.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.natsUi.persistence.size | quote }}
{{- end }}
