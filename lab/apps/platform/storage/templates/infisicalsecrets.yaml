{{- $items := list
  (dict "name" "postgresql" "path" "/apps/platform-storage/postgresql" "secretName" "postgresql")
  (dict "name" "rabbitmq" "path" "/apps/platform-storage/rabbitmq" "secretName" "rabbitmq")
  (dict "name" "nats" "path" "/apps/platform-storage/nats" "secretName" "nats")
  (dict "name" "nats-monitoring" "path" "/apps/platform-storage/nats-monitoring" "secretName" "nats-monitoring-basic-auth" "templateKey" "NATS_MONITORING_USERS" "templateName" "users")
-}}
{{- range $item := $items }}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ printf "infisical-%s" ($item.name | trunc 50 | trimSuffix "-") }}
  labels:
    app.kubernetes.io/name: platform-storage
    app.kubernetes.io/part-of: home-lab
    home-lab/managed-by: infisical
spec:
  hostAPI: http://infisical-backend.platform-secrets.svc.cluster.local:8080/api
  syncConfig:
    resyncInterval: 1m
    instantUpdates: false
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: platform-secrets
      secretsScope:
        projectSlug: {{ $.Values.infisical.projectSlug | quote }}
        envSlug: {{ $.Values.infisical.envSlug | quote }}
        secretsPath: {{ $item.path }}
  managedSecretReference:
    secretName: {{ $item.secretName }}
    secretNamespace: {{ $.Release.Namespace }}
    creationPolicy: Owner
    template:
      includeAllSecrets: {{ not $item.templateKey }}
    {{- with $item.templateKey }}
      data:
        {{- if $item.templateExpression }}
        {{ $item.templateName }}: {{ $item.templateExpression | quote }}
        {{- else }}
        {{ $item.templateName }}: {{ printf "{{ .%s.Value }}" . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
