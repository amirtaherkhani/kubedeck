{{- if and .Values.nats.enabled .Values.nats.monitoringIngress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "platform-storage.natsMonitoringName" . }}-basic-auth
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.natsMonitoringLabels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ include "platform-storage.natsMonitoringName" . }}-basic-auth
{{- end }}
