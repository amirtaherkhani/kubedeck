{{- if .Values.mailpit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-storage.mailpitName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.mailpitLabels" . | nindent 4 }}
spec:
  type: {{ .Values.mailpit.service.type }}
  ports:
    - name: smtp
      port: {{ .Values.mailpit.service.smtpPort }}
      targetPort: smtp
  selector:
    {{- include "platform-storage.mailpitLabels" . | nindent 4 }}
{{- end }}
