{{- if and .Values.minio.enabled (or .Release.IsInstall .Values.minio.initOnUpgrade) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "platform-storage.minioInitName" . }}
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.minioLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ if .Release.IsInstall }}post-install{{ else }}post-upgrade{{ end }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "platform-storage.minioLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: "{{ .Values.minio.mcImage.repository }}:{{ .Values.minio.mcImage.tag }}"
          imagePullPolicy: {{ .Values.minio.mcImage.pullPolicy }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.minioName" . }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.minioName" . }}
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.minioName" . }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-storage.minioName" . }}
                  key: MINIO_SECRET_KEY
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://{{ include "platform-storage.minioName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.minio.service.apiPort }} "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done

              mc mb --ignore-existing local/{{ .Values.minio.defaultBucket }}

              if ! mc admin user info local "$MINIO_ACCESS_KEY" >/dev/null 2>&1; then
                mc admin user add local "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
              fi

              cat >/tmp/app-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:*"],
                    "Resource": [
                      "arn:aws:s3:::{{ .Values.minio.defaultBucket }}",
                      "arn:aws:s3:::{{ .Values.minio.defaultBucket }}/*"
                    ]
                  }
                ]
              }
              EOF

              mc admin policy create local app-default /tmp/app-policy.json >/dev/null 2>&1 || true
              mc admin policy attach local app-default --user "$MINIO_ACCESS_KEY"
{{- end }}
