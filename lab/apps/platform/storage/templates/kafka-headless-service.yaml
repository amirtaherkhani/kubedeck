{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-storage.kafkaName" . }}-headless
  labels:
    {{- include "platform-storage.labels" . | nindent 4 }}
    {{- include "platform-storage.kafkaLabels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: internal
      port: {{ .Values.kafka.service.internalPort }}
      targetPort: internal
    - name: controller
      port: {{ .Values.kafka.service.controllerPort }}
      targetPort: controller
  selector:
    {{- include "platform-storage.kafkaLabels" . | nindent 4 }}
{{- end }}
