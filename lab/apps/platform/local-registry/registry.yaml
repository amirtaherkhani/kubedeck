# Docker Desktop's built-in kind runtime has a separate image store from the
# Docker CLI. This single-node registry lets a Mac-side client push through
# kubectl port-forward while the node pulls from its own localhost:5001.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubedeck-local-registry
  namespace: platform-system
  labels:
    app.kubernetes.io/name: kubedeck-local-registry
    app.kubernetes.io/part-of: kubedeck-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedeck-local-registry
  namespace: platform-system
  labels:
    app.kubernetes.io/name: kubedeck-local-registry
    app.kubernetes.io/part-of: kubedeck-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubedeck-local-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubedeck-local-registry
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_HTTP_ADDR
              value: 127.0.0.1:5001
          ports:
            - name: registry
              containerPort: 5001
              hostPort: 5001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubedeck-local-registry
