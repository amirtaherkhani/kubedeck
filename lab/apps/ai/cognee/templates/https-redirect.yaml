apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "cognee.fullname" . }}-https-redirect
  labels:
    {{- include "cognee.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cognee.fullname" . }}-http
  labels:
    {{- include "cognee.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-https-redirect@kubernetescrd" .Release.Namespace (include "cognee.fullname" .) | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cognee.fullname" . }}
                port:
                  name: http
