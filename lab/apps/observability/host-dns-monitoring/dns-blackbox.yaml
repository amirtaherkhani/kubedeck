apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-blackbox
  labels:
    app.kubernetes.io/name: dns-blackbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-blackbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-blackbox
    spec:
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          args:
            - --config.file=/etc/blackbox/blackbox.yml
            - --config.enable-auto-reload
            - --web.listen-address=:9115
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dns-blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: dns-blackbox
  labels:
    app.kubernetes.io/name: dns-blackbox
spec:
  selector:
    app.kubernetes.io/name: dns-blackbox
  ports:
    - name: http
      port: 9115
      targetPort: http
