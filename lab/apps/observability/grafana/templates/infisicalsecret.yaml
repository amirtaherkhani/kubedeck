{{- $authMethod := default "universalAuth" .Values.infisical.authMethod -}}
{{- if not (has $authMethod (list "universalAuth" "kubernetesAuth")) -}}
{{- fail "infisical.authMethod must be universalAuth or kubernetesAuth" -}}
{{- end -}}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: grafana-admin
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    home-lab/managed-by: infisical
spec:
  hostAPI: {{ required "infisical.hostAPI is required" .Values.infisical.hostAPI | quote }}
  syncConfig:
    resyncInterval: 1m
    instantUpdates: false
  authentication:
    {{ $authMethod }}:
      {{- if eq $authMethod "universalAuth" }}
      credentialsRef:
        secretName: {{ required "infisical.credentialsSecretName is required" .Values.infisical.credentialsSecretName | quote }}
        secretNamespace: {{ required "infisical.credentialsSecretNamespace is required" .Values.infisical.credentialsSecretNamespace | quote }}
      {{- else }}
      {{- $k8 := default dict .Values.infisical.kubernetesAuth }}
      {{- $sa := default dict $k8.serviceAccountRef }}
      identityId: {{ required "infisical.kubernetesAuth.identityId is required" $k8.identityId | quote }}
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: {{ required "infisical.kubernetesAuth.serviceAccountRef.name is required" $sa.name | quote }}
        namespace: {{ required "infisical.kubernetesAuth.serviceAccountRef.namespace is required" $sa.namespace | quote }}
      {{- with $k8.serviceAccountTokenAudiences }}
      serviceAccountTokenAudiences:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      secretsScope:
        projectSlug: {{ required "infisical.projectSlug is required" .Values.infisical.projectSlug | quote }}
        envSlug: {{ required "infisical.envSlug is required" .Values.infisical.envSlug | quote }}
        secretsPath: {{ required "infisical.secretsPath is required" .Values.infisical.secretsPath | quote }}
  managedSecretReference:
    secretName: grafana-admin
    secretNamespace: {{ include "grafana.namespace" . }}
    creationPolicy: Owner
    template:
      includeAllSecrets: true
