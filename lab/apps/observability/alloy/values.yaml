controller:
  type: daemonset

configReloader:
  enabled: false

serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
  interval: 30s

alloy:
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: h2c
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  configMap:
    content: |
      logging {
        level = "info"
      }

      // Receive application traces over the standard OTLP gRPC and HTTP ports.
      // Logs continue through the Kubernetes stdout-to-Loki pipeline below.
      otelcol.receiver.otlp "traces" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          traces = [otelcol.processor.batch.traces.input]
        }
      }

      otelcol.processor.batch "traces" {
        timeout         = "1s"
        send_batch_size = 1024

        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.observability.svc.cluster.local:4317"

          tls {
            insecure             = true
            insecure_skip_verify = true
          }
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {

        stage.static_labels {
          values = {
            cluster = "local",
          }
        }

        // Parse application NDJSON once at ingestion. Only bounded,
        // low-cardinality dimensions become indexed Loki labels.
        stage.json {
          expressions = {
            level                  = "level",
            service_name           = "service_name",
            service_version        = "service_version",
            deployment_environment = "deployment_environment",
            component              = "component",
            outcome                = "outcome",
            event_name             = "event_name",
            operation              = "operation",
            logger                 = "logger",
            request_id             = "request_id",
            correlation_id         = "correlation_id",
            causation_id           = "causation_id",
            trace_id               = "trace_id",
            span_id                = "span_id",
            event_id               = "event_id",
            job_id                 = "job_id",
            workflow_execution_id  = "workflow_execution_id",
            http_method            = "http_method",
            http_route             = "http_route",
            http_status_code       = "http_status_code",
            provider               = "provider",
            queue                  = "queue",
            websocket_event        = "websocket_event",
          }
        }

        stage.labels {
          values = {
            level                  = "",
            service_name           = "",
            service_version        = "",
            deployment_environment = "",
            component              = "",
            outcome                = "",
          }
        }

        // Searchable correlation and domain fields stay unindexed to avoid
        // creating one Loki stream per request, trace, event, job, or workflow.
        stage.structured_metadata {
          values = {
            event_name            = "",
            operation             = "",
            logger                = "",
            request_id            = "",
            correlation_id        = "",
            causation_id          = "",
            trace_id              = "",
            span_id               = "",
            event_id              = "",
            job_id                = "",
            workflow_execution_id = "",
            http_method           = "",
            http_route            = "",
            http_status_code      = "",
            provider              = "",
            queue                 = "",
            websocket_event       = "",
          }
        }

        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
