replicaCount: 1

image:
  repository: ghcr.io/skyhook-io/radar
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9280

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: observability-radar-https-redirect@kubernetescrd
  tls:
    - secretName: local-dev-tls
      hosts:
        - radar.local.dev
  hosts:
    - host: radar.local.dev
      paths:
        - path: /
          pathType: Prefix

auth:
  mode: none

timeline:
  storage: sqlite
  dbPath: /data/timeline.db
  # Keep the local activity timeline bounded for development.
  retention: 72h
  maxSize: 800Mi

persistence:
  enabled: true
  storageClassName: standard
  accessMode: ReadWriteOnce
  size: 1Gi

rbac:
  create: true
  helm: true
  secrets: false
  podExec: false
  podLogs: true
  portForward: false
  metrics: true
  viewRBAC: false
  viewWebhooks: false

traffic:
  prometheusUrl: http://caretta-vm.observability.svc.cluster.local:8428

mcp:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
