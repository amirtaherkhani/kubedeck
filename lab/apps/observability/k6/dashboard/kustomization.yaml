apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/component: grafana-dashboard
    grafana_dashboard: "1"

configMapGenerator:
  - name: k6-prometheus-dashboard
    files:
      - k6-prometheus-dashboard.json
  - name: k6-prometheus-native-histograms-dashboard
    files:
      - k6-prometheus-native-histograms-dashboard.json

resources:
  - k6-dashboard-redirect.yaml
