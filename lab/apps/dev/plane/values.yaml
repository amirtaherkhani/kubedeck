# Plane Community Edition 1.4.1 from the pinned makeplane/plane-ce chart 1.6.2.
# Credentials are injected by InfisicalSecret resources.
planeVersion: v1.4.1

ingress:
  enabled: true
  appHost: plane.local.dev
  minioHost: ""
  rabbitmqHost: ""
  ingressClass: traefik
  traefik:
    maxRequestBodyBytes: 20971520

ssl:
  tls_secret_name: local-dev-tls
  createIssuer: false
  generateCerts: false

redis:
  # Use the shared platform-storage Redis instance. Connection URL is supplied
  # through the Plane app/live secrets synchronized from Infisical.
  local_setup: false
  annotations: &infisicalAutoReload
    secrets.infisical.com/auto-reload: "true"

postgres:
  # Use the shared platform-storage PostgreSQL instance. Plane's connection
  # URL is supplied through the app secret synchronized from Infisical.
  local_setup: false

rabbitmq:
  local_setup: true
  image: rabbitmq:3.13.6-management-alpine
  storageClass: local-path
  annotations: *infisicalAutoReload

minio:
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  image_mc: minio/mc:RELEASE.2025-08-13T08-35-41Z
  local_setup: true
  storageClass: local-path
  volumeSize: 1Gi
  annotations: *infisicalAutoReload
  env:
    minio_endpoint_ssl: false

web:
  annotations: *infisicalAutoReload

space:
  annotations: *infisicalAutoReload

admin:
  annotations: *infisicalAutoReload

live:
  annotations: *infisicalAutoReload

api:
  annotations: *infisicalAutoReload

worker:
  annotations: *infisicalAutoReload

beatworker:
  annotations: *infisicalAutoReload

external_secrets:
  rabbitmq_existingSecret: plane-rabbitmq
  doc_store_existingSecret: plane-storage
  app_env_existingSecret: plane-app
  live_env_existingSecret: plane-live

env:
  pgdb_username: ""
  pgdb_password: ""
  pgdb_name: ""
  remote_redis_url: ""
  pgdb_remote_url: ""
  docstore_bucket: uploads
  doc_upload_size_limit: "5242880"
  aws_access_key: ""
  aws_secret_access_key: ""
  aws_region: ""
  aws_s3_endpoint_url: ""
  secret_key: ""
  live_server_secret_key: ""
  cors_allowed_origins: https://plane.local.dev
  default_cluster_domain: cluster.local
  api_key_rate_limit: 60/minute
