{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name | quote }}
  labels:
    app.kubernetes.io/name: kuchdesk-infisical-helm-probe
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuchdesk-infisical-helm-probe
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuchdesk-infisical-helm-probe
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      containers:
        - name: probe
          image: {{ required "image is required" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exec sleep 3600"]
          env:
            - name: KUCHDESK_HELM_PROBE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.managedSecret.name | quote }}
                  key: {{ required "managedSecret.key is required" .Values.managedSecret.key | quote }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -n \"$KUCHDESK_HELM_PROBE\""]
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
{{- end }}
