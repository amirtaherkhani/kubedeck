apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-dev-ca
  namespace: platform-system
  labels:
    app.kubernetes.io/name: local-dev-ca
    app.kubernetes.io/component: certificate-authority
    app.kubernetes.io/part-of: home-lab
spec:
  secretName: local-dev-ca
  issuerRef:
    name: local-dev-selfsigned
    kind: ClusterIssuer
  commonName: Home Lab Local Development CA
  isCA: true
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
    - digital signature
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-dev-tls
  namespace: platform-system
  labels:
    app.kubernetes.io/name: local-dev-tls
    app.kubernetes.io/component: certificate
    app.kubernetes.io/part-of: home-lab
spec:
  secretName: local-dev-tls
  issuerRef:
    name: local-dev-ca
    kind: ClusterIssuer
  commonName: local.dev
  dnsNames:
    - local.dev
    - '*.local.dev'
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
---
