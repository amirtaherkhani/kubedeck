apiVersion: v1
kind: Service
metadata:
  name: technitium-lan
  namespace: technitium
  labels:
    app.kubernetes.io/name: technitium-lan
    app.kubernetes.io/part-of: kubedeck-platform
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
